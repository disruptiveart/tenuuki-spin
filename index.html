<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tenuuki-spin (dist)</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./dist/tenuuki-spin-viewer.css" />
    <style>
      tenuuki-spin-viewer {
        display: block;
        width: 300px;
        height: 300px;
      }
    </style>
  </head>
  <body class="p-4">
    <h1 class="h4 mb-3">Tenuuki Spin (Library Build)</h1>

    <tenuuki-spin-viewer
      id="viewerVertical"
      class="tenuuki-spin-container"
      data-image-base-url="./public/spinner_frames_vertical_box/box-{i}.webp"
      data-image-count="60"
      data-image-number-padding="4"
      data-replacement-token="i"
      data-axis="y"
      data-direction="-1"
      data-draggable="true"
      data-initial-spin="true"
      data-spin-offset="180"
    ></tenuuki-spin-viewer>


    <tenuuki-spin-viewer
      id="viewerHorizontal"
      class="tenuuki-spin-container"
      data-image-base-url="./public/spinner_frames_horizontal_box/box-{frame}.webp"
      data-image-count="60"
      data-image-number-padding="4"
      data-axis="x"
      data-direction="-1"
      data-draggable="true"
      data-initial-spin="true"
      data-initial-frame="20"
      data-spin-offset="180"
    ></tenuuki-spin-viewer>


    <div class="row flex-columns-md mt-4 g-3">
      <div class="col">
       <div class="btn btn-primary" id="play">Play</div>
      <input type="number" id="playRotationsInput" class="form-control d-inline-block w-auto" placeholder="Rotations" />
     </div>
     <div class="col">
       <div class="btn btn-primary" id="stop">Stop</div>
       <div class="btn btn-primary" id="replayBtn">Replay</div>
      </div>
      <div class="col">
        <div class="btn btn-primary" id="gotoFrameBtn">Go to Frame</div>
        <input type="number" id="frameInput" class="form-control d-inline-block w-auto" placeholder="Frame #" />
      </div>
      <div class="col">
        <div class="btn btn-primary" id="spinToFrameBtn">Spin to Frame</div>
        <input type="number" id="spinToFrameInput" class="form-control d-inline-block w-auto" placeholder="Frame #" />
        <input type="checkbox" id="spinToShortestPathInput" class="form-check-input" />
        <label for="spinToShortestPathInput" class="form-check-label">Shortest Path
      </div>
    </div>
    <script>
      // Host reference example: call replay() directly on an existing custom element.
      const viewer = document.getElementById('viewerVertical');

      const replayBtn = document.getElementById('replayBtn');
      const playRotationsInput = document.getElementById('playRotationsInput');
      replayBtn?.addEventListener('click', () => {
        const rotations = parseInt(playRotationsInput?.value || '1', 10);
        // replay(rotations, targetFrame?)
        viewer?.replay(rotations);
      });

      const gotoFrameBtn = document.getElementById('gotoFrameBtn');
      const frameInput = document.getElementById('frameInput');
      gotoFrameBtn?.addEventListener('click', () => {
        const frame = parseInt(frameInput?.value || '0', 10);
        viewer?.goTo(frame);
      });

      const stopBtn = document.getElementById('stop');
      stopBtn?.addEventListener('click', () => {
        viewer?.stop();
      });

      const playBtn = document.getElementById('play');
      playBtn?.addEventListener('click', () => {
        viewer?.play();
      });

      const spinToFrameBtn = document.getElementById('spinToFrameBtn');
      const spinToFrameInput = document.getElementById('spinToFrameInput');
      spinToFrameBtn?.addEventListener('click', () => {
        const frame = parseInt(spinToFrameInput?.value || '0', 10);
        const shortestPath = document.getElementById('spinToShortestPathInput')?.checked;
        viewer?.spinTo(frame, 2, shortestPath);
      });
    </script>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
