<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tenuuki-spin (dist)</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./dist/tenuuki-spin-viewer.css" />
    <style>
      tenuuki-spin-viewer {
        display: block;
        width: 300px;
        height: 300px;
      }
    </style>
  </head>
  <body class="p-4">
    <h1 class="h4 mb-3">Tenuuki Spin (Library Build)</h1>

    <tenuuki-spin-viewer
      id="viewer"
      data-image-base-url="./public/spinner_frames_vertical_box/box-{i}.webp"
      data-image-count="60"
      data-image-number-padding="4"
      data-replacement-token="i"
      data-axis="y"
      data-direction="-1"
      data-draggable="true"
      data-initial-spin="true"
      data-spin-offset="180"
    ></tenuuki-spin-viewer>


    <tenuuki-spin-viewer
      id="viewer"
      data-image-base-url="./public/spinner_frames_horizontal_box/box-{frame}.webp"
      data-image-count="60"
      data-image-number-padding="4"
      data-axis="x"
      data-direction="-1"
      data-draggable="true"
      data-initial-spin="true"
      data-initial-frame="20"
      data-spin-offset="180"
    ></tenuuki-spin-viewer>

    <div class="btn btn-primary" id="replayBtn">Replay</div>
    <script>
      // You can also create the viewer programmatically like this:
      const viewer = document.createElement('tenuuki-spin-viewer');
      viewer.setAttribute('data-image-base-url', './public/spinner_frames_vertical_box/box-{i}.webp');
      viewer.setAttribute('data-image-count', '60');
      viewer.setAttribute('data-image-number-padding', '4');
      viewer.setAttribute('data-replacement-token', 'i');
      viewer.setAttribute('data-axis', 'y');
      viewer.setAttribute('data-direction', '-1');
      viewer.setAttribute('data-draggable', 'true');
      viewer.setAttribute('data-initial-spin', 'true');
      viewer.setAttribute('data-spin-offset', '180');
      document.body.appendChild(viewer);

      const replayBtn = document.getElementById('replayBtn');
      replayBtn?.addEventListener('click', () => {
        viewer.replay(2);
      });

    </script>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
